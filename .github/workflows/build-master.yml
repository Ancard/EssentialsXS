name: Build EssentialsXS

on:
  push:
    branches:
    - 2.x
    - dev/*
  release:
    types:
    - published

jobs:
  build:
    name: Build and upload
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Git repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 25

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build with Gradle
      run: |
        chmod +x gradlew
        ./gradlew :EssentialsX:build :EssentialsXChat:build :EssentialsXProtect:build :EssentialsXAntiBuild:build :EssentialsXSpawn:build :EssentialsXGeoIP:build :storage-jdbc:check --stacktrace

    - name: Publish JUnit report
      uses: mikepenz/action-junit-report@v5
      if: success() || failure() # Run even if the previous step fails
      with:
        report_paths: '**/build/test-results/test*/TEST-*.xml'

    - name: Archive plugin jars on GitHub
      uses: actions/upload-artifact@v7
      with:
        name: EssentialsXS plugin jars
        path: jars/

    - name: Upload EssentialsXS jar
      uses: actions/upload-artifact@v7
      with:
        path: jars/EssentialsXS-*.jar
        archive: false

    - name: Upload EssentialsXSAntiBuild jar
      uses: actions/upload-artifact@v7
      with:
        path: jars/EssentialsXSAntiBuild-*.jar
        archive: false

    - name: Upload EssentialsXSChat jar
      uses: actions/upload-artifact@v7
      with:
        path: jars/EssentialsXSChat-*.jar
        archive: false



    - name: Upload EssentialsXSGeoIP jar
      uses: actions/upload-artifact@v7
      with:
        path: jars/EssentialsXSGeoIP-*.jar
        archive: false

    - name: Upload EssentialsXSProtect jar
      uses: actions/upload-artifact@v7
      with:
        path: jars/EssentialsXSProtect-*.jar
        archive: false

    - name: Upload EssentialsXSSpawn jar
      uses: actions/upload-artifact@v7
      with:
        path: jars/EssentialsXSSpawn-*.jar
        archive: false


    - name: Deploy to Maven repo
      if: ${{ success() && github.event_name == 'push' && github.repository == 'EssentialsX/Essentials' && github.ref == 'refs/heads/2.x' }}
      env:
        ORG_GRADLE_PROJECT_essxUsername: ${{ secrets.ESSENTIALSX_DEPLOY_USERNAME }}
        ORG_GRADLE_PROJECT_essxPassword: ${{ secrets.ESSENTIALSX_DEPLOY_PASSWORD }}
      run: |
        ./gradlew publish

    - name: Prepare Javadocs
      run: |
        mv Essentials/build/docs/javadoc/ javadocs/
        cp -r EssentialsAntiBuild/build/docs/javadoc/ javadocs/EssentialsAntiBuild/
        cp -r EssentialsChat/build/docs/javadoc/ javadocs/EssentialsChat/
        cp -r EssentialsGeoIP/build/docs/javadoc/ javadocs/EssentialsGeoIP/
        cp -r EssentialsProtect/build/docs/javadoc/ javadocs/EssentialsProtect/
        cp -r EssentialsSpawn/build/docs/javadoc/ javadocs/EssentialsSpawn/

    - name: Archive Javadocs
      uses: actions/upload-artifact@v7
      with:
        name: javadocs
        path: javadocs/

  publish-jd:
    name: Publish Javadocs
    needs: build
    if: ${{ github.event_name == 'push' && github.repository == 'EssentialsX/Essentials' && github.ref == 'refs/heads/2.x' }}
    runs-on: ubuntu-latest

    steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Download Javadocs
      uses: actions/download-artifact@v8
      with:
        name: javadocs
        path: javadocs/

    - name: Deploy Javadocs
      run: npx netlify-cli deploy --dir=javadocs/ --prod --message="GitHubActionsDeploy"
      env:
        NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_JD_AUTH_TOKEN }}
        NETLIFY_SITE_ID: ${{ secrets.NETLIFY_JD_2X_SITE_ID }}
